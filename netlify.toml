[build]
  command = "node tools/build.js"
  publish = "dist"

# version.json en de pagina zelf nooit uit een cache halen, zodat updates direct gezien worden
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
